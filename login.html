<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome!</title>
    <!-- 所有样式都在这个文件里 -->
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="bg-img bg1"></div>
    <div class="bg-img bg2"></div>
    <div class="bg-img bg3"></div>
    <div class="bg-img bg4"></div>
        
    <div class="登录区">

        <div class="标题">
            <h1>登录</h1>
        </div>

        <div class="raw">
        <div class="tip">用户</div>
        <input type="text" placeholder="请输入用户名" class="userinpute" id="text-name">
        </div>
        <div class="raw">
        <div class="tip">邮箱</div>
        <input type="text" placeholder="请输入邮箱" class="userinpute">
        </div>

        <div class="raw">
        <div class="tip">密码</div>
        <input type="password" placeholder="请输入密码" class="userinpute">
        </div>

        <button class="conform" id="conform-up">确认登录</button>

    </div>

    <!-- 所有逻辑都在这个文件里 -->
    <script src="login.js" defer></script>
</body>
</html>
